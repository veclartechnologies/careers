<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121318">
<title>Business Development Executive — Veclar Technologies</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Muli:wght@300;400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#121318;--bg2:#191c26;--ink:#f7f4ec;--muted:#a8a49a;--line:rgba(255,255,255,.1);--panel:rgba(255,255,255,.055);--panel2:rgba(255,255,255,.028);--brand:#d5a62a;--brand2:#f0d489;--ok:#37d399;--bad:#ff6b6b;--warn:#f2c88a;--r:22px;--shadow:0 30px 70px -40px rgba(0,0,0,.95)}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Muli',Poppins,system-ui,sans-serif;font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(900px 600px at 12% -8%,rgba(213,166,42,.16),transparent 60%),radial-gradient(760px 520px at 88% 4%,rgba(240,212,137,.09),transparent 62%),radial-gradient(900px 700px at 50% 110%,rgba(213,166,42,.08),transparent 65%)}
h1,h2,h3,h4,.font-d{font-family:'Poppins','Muli',sans-serif;letter-spacing:-.01em;font-weight:600}
button{font-family:inherit}
[hidden]{display:none!important}
a{color:var(--brand2)}
.wrap{max-width:780px;margin:0 auto;padding:24px 18px 150px}
/* loader */
#loader{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:rgba(18,19,24,.94);backdrop-filter:blur(22px);transition:opacity .7s ease,visibility .7s}
#loader.off{opacity:0;visibility:hidden}
.ring{width:104px;height:104px;border-radius:50%;position:relative;background:conic-gradient(from 0deg,transparent 0 18%,var(--brand) 42%,var(--brand2) 62%,transparent 84%);animation:spin 1.15s linear infinite}
.ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:#15161c;box-shadow:inset 0 0 26px rgba(213,166,42,.35)}
.ring i{position:absolute;inset:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));animation:pulse 1.7s ease-in-out infinite;z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.05)}}
.ld-brand{font-family:'Poppins',sans-serif;font-size:13px;letter-spacing:.44em;text-transform:uppercase;color:#f0e6cd;text-align:center}
.ld-brand span{display:block;font-size:9px;letter-spacing:.3em;color:#8a8578;margin-top:7px}
.ld-text{color:var(--muted);font-size:12.5px;letter-spacing:.06em}
/* header */
.hdr{position:sticky;top:0;z-index:40;backdrop-filter:blur(18px);background:rgba(18,19,24,.8);border-bottom:1px solid var(--line)}
.hdr-in{max-width:780px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.mark{width:38px;height:38px;display:grid;place-items:center;flex:none}
.mark img{width:100%;height:100%;object-fit:contain}
.bt{min-width:0}
.bt b{display:block;font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt span{display:block;font-size:10px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.hdr-right{display:flex;align-items:center;gap:9px;flex:none}
.trackbtn{background:rgba(213,166,42,.12);border:1px solid rgba(213,166,42,.42);color:#f3dfa8;font-size:11.5px;font-weight:600;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.18s;font-family:'Poppins',sans-serif}
.trackbtn:hover{background:rgba(213,166,42,.22)}
.stage{text-align:right;flex:none;min-width:64px}
.stage b{display:block;font-size:11.5px;font-weight:600;color:#f3e8cd;white-space:nowrap}
.stage span{display:block;font-size:10px;color:var(--muted);letter-spacing:.06em}
.pbar{height:2px;background:rgba(255,255,255,.07)}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .55s cubic-bezier(.4,0,.2,1);box-shadow:0 0 14px rgba(213,166,42,.7)}
/* card */
.card{background:linear-gradient(165deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--r);padding:26px 22px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}
#main.anim>.card{animation:rise .5s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stepno{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#b3954f;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-family:'Poppins',sans-serif}
.stepno::before{content:"";width:22px;height:1px;background:linear-gradient(90deg,var(--brand),transparent)}
h1{font-size:clamp(22px,5.2vw,29px);line-height:1.25;margin:0 0 8px}
.sub{color:var(--muted);font-size:14.2px;margin:0 0 22px;max-width:58ch}
.field{margin-bottom:16px}
.field label{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#a49b83;margin-bottom:7px;font-family:'Poppins',sans-serif}
input[type=text],input[type=email],input[type=tel],input[type=number],select,textarea{width:100%;padding:14px 15px;border-radius:14px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.045);color:var(--ink);font-size:15.5px;font-family:inherit;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(213,166,42,.85);box-shadow:0 0 0 4px rgba(213,166,42,.14);background:rgba(255,255,255,.07)}
input::placeholder{color:#6d685e}
select option{background:#1c1d26;color:#f7f4ec}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 24px;border-radius:14px;border:1px solid transparent;font-size:14px;font-weight:600;cursor:pointer;transition:transform .16s,box-shadow .2s,background .2s,opacity .2s;font-family:'Poppins',sans-serif;letter-spacing:.01em;text-decoration:none}
.btn:active{transform:translateY(1px) scale(.995)}
.btn-p{background:linear-gradient(135deg,#e0b23c,#c1921f);color:#1b1608;box-shadow:0 16px 34px -18px rgba(213,166,42,.95)}
.btn-p:hover{box-shadow:0 20px 40px -14px rgba(213,166,42,.95)}
.btn-g{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.13);color:#e6e1d5}
.btn-g:hover{background:rgba(255,255,255,.1)}
.btn-ok{background:linear-gradient(135deg,#37d399,#20a978);color:#04170f;box-shadow:0 16px 34px -18px rgba(55,211,153,.9)}
.btn-bad{background:linear-gradient(135deg,#ff6b6b,#d94242);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-sm{padding:10px 16px;font-size:12.5px;border-radius:11px}
.nav{display:flex;gap:12px;margin-top:26px;align-items:center}
.nav .grow{flex:1}
.err{display:none;margin:0 0 14px;padding:11px 14px;border-radius:12px;background:rgba(255,107,107,.11);border:1px solid rgba(255,107,107,.34);color:#ffc2c2;font-size:13.5px}
.err.on{display:block;animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* job description */
.jd{padding:26px 22px}
.jd h1{font-size:clamp(25px,6vw,34px);margin-bottom:12px}
.jdfacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 4px}
.jdfact{padding:13px 14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.jdfact span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#a49b83;margin-bottom:4px;font-family:'Poppins',sans-serif}
.jdfact b{font-size:13.5px;font-weight:600;line-height:1.4;display:block}
.jdsec{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.jdsec h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#c9a75a;margin:0 0 12px;font-family:'Poppins',sans-serif}
.jdsec ul{margin:0;padding-left:20px}
.jdsec li{margin-bottom:9px;color:#d8d3c7;font-size:14.4px}
.jdsec p{color:#d8d3c7;font-size:14.4px;margin:0 0 12px}
.jdnote{padding:14px 16px;border-radius:14px;background:rgba(213,166,42,.09);border:1px solid rgba(213,166,42,.3);color:#efe3c6;font-size:13.4px}
/* options */
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:15px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035);cursor:pointer;transition:all .18s;font-size:14.6px;text-align:left;color:var(--ink);width:100%;font-family:inherit;line-height:1.5}
.opt:hover{border-color:rgba(213,166,42,.55);background:rgba(213,166,42,.08)}
.opt.sel{border-color:rgba(213,166,42,.9);background:rgba(213,166,42,.14);box-shadow:0 0 0 3px rgba(213,166,42,.1)}
.dot{width:19px;height:19px;border-radius:50%;border:1.6px solid rgba(255,255,255,.3);flex:none;display:grid;place-items:center;transition:.18s}
.opt.sel .dot{border-color:var(--brand);background:var(--brand)}
.opt.sel .dot::after{content:"";width:7px;height:7px;border-radius:50%;background:#1b1608}
.chk{width:19px;height:19px;border-radius:6px;border:1.6px solid rgba(255,255,255,.3);flex:none;display:grid;place-items:center;transition:.18s;font-size:12px;color:#1b1608}
.opt.sel .chk{border-color:var(--brand2);background:var(--brand2)}
.opt.sel .chk::after{content:"✓";font-weight:700}
.opt small{display:block;color:var(--muted);font-size:12.2px;margin-top:3px;font-weight:400;line-height:1.5}
/* combobox */
.combo{position:relative}
.combo-list{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:240px;overflow:auto;background:#1c1d26;border:1px solid rgba(255,255,255,.14);border-radius:14px;box-shadow:0 26px 60px -20px #000;z-index:30;padding:6px}
.combo-item{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:transparent;color:#e6e1d5;font-size:14px;border-radius:9px;cursor:pointer}
.combo-item:hover{background:rgba(213,166,42,.18)}
.combo-empty{padding:12px;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:rgba(213,166,42,.14);border:1px solid rgba(213,166,42,.4);color:#f0dca8;font-family:'Poppins',sans-serif}
.dist{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:linear-gradient(135deg,rgba(213,166,42,.12),rgba(240,212,137,.06));border:1px solid rgba(213,166,42,.32);margin-top:6px;flex-wrap:wrap}
.dist b{font-family:'Poppins',sans-serif;font-size:23px;display:block;line-height:1.1}
.dist span{font-size:12.5px;color:#c9bd9c}
.dist.warn{background:rgba(242,200,138,.1);border-color:rgba(242,200,138,.35)}
/* modal */
.ov{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(6,6,9,.78);backdrop-filter:blur(9px)}
.ov.on{display:flex;animation:fade .22s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:470px;background:linear-gradient(165deg,#20212b,#16171f);border:1px solid rgba(255,255,255,.13);border-radius:24px;padding:26px 24px;box-shadow:0 40px 90px -30px #000;animation:pop .3s cubic-bezier(.16,1,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.modal h3{font-size:19px;margin:0 0 10px}
.modal p{color:#cfcabd;font-size:14.2px;margin:0 0 20px;line-height:1.65}
.modal .row{display:flex;gap:10px;flex-wrap:wrap}
.modal .row .btn{flex:1;min-width:130px}
/* blackout */
#blackout{position:fixed;inset:0;z-index:80;background:#0c0d11;display:flex;align-items:center;justify-content:center;padding:32px;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s}
#blackout.on{opacity:1;visibility:visible}
#blackoutMsg{font-family:'Poppins',sans-serif;font-size:clamp(20px,5vw,30px);font-weight:500;text-align:center;color:#f7f4ec;max-width:22ch;line-height:1.4}
#blackoutMsg::after{content:"|";animation:blink .8s step-end infinite;opacity:.6;color:var(--brand)}
@keyframes blink{50%{opacity:0}}
/* circular progress overlay */
#upOv{position:fixed;inset:0;z-index:88;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:rgba(8,8,11,.82);backdrop-filter:blur(10px)}
#upOv.on{display:flex}
.upring{position:relative;width:132px;height:132px;display:grid;place-items:center}
.upring svg{width:132px;height:132px;transform:rotate(-90deg)}
.upring circle{fill:none;stroke-width:8;stroke-linecap:round}
.upb{stroke:rgba(255,255,255,.1)}
.upf{stroke:url(#upGrad);stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .25s ease}
.upring b{position:absolute;font-family:'Poppins',sans-serif;font-size:26px;font-weight:600;color:#f7f4ec}
#upLabel{color:#cfcabd;font-size:13.5px;letter-spacing:.04em;margin:0;text-align:center;max-width:80vw}
/* recorder */
#recbar{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;justify-content:center;background:linear-gradient(to top,rgba(18,19,24,.97),rgba(18,19,24,.6),transparent)}
#recbar.on{display:flex}
.recpill{width:100%;max-width:430px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 14px;border-radius:999px;background:rgba(28,29,38,.94);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);box-shadow:0 24px 50px -20px #000}
.recside{background:none;border:0;color:#d5cfc0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;cursor:pointer;padding:8px 6px;border-radius:10px;min-width:52px;font-family:'Poppins',sans-serif}
.recside:hover{background:rgba(255,255,255,.07)}
.recside[disabled]{opacity:.35;cursor:not-allowed}
.mic{width:62px;height:62px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:linear-gradient(140deg,#e0b23c,#c1921f);box-shadow:0 14px 30px -12px rgba(213,166,42,.9);position:relative;transition:transform .15s;flex:none}
.mic:active{transform:scale(.95)}
.mic.rec{background:linear-gradient(140deg,#ff6b6b,#d94242)}
.mic.rec::before,.mic.rec::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,107,107,.5);animation:halo 1.9s ease-out infinite}
.mic.rec::after{animation-delay:.95s}
@keyframes halo{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.mic svg{width:24px;height:24px;fill:none;stroke:#1b1608;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rectime{font-family:'Poppins',monospace;font-size:13px;color:#f3e8cd;text-align:center;line-height:1.2;flex:1}
.rectime b{display:block;font-size:16px;letter-spacing:.04em}
.rectime span{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#silencePill{position:fixed;left:50%;transform:translate(-50%,10px);bottom:calc(96px + env(safe-area-inset-bottom));z-index:46;padding:9px 18px;border-radius:999px;background:rgba(255,107,107,.16);border:1px solid rgba(255,107,107,.5);color:#ffd0d0;font-size:12.5px;font-weight:600;backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:.3s;white-space:nowrap;max-width:92vw}
#silencePill.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
/* misc */
.script{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:18px;font-size:14px;line-height:1.8;color:#d8d3c7;max-height:300px;overflow:auto}
.script b{color:#fff}
.script .role{color:var(--brand2);font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-top:12px;font-family:'Poppins',sans-serif}
.script .role:first-child{margin-top:0}
.filebox{display:block;width:100%;border:1.5px dashed rgba(255,255,255,.2);border-radius:18px;padding:26px 18px;text-align:center;transition:.2s;cursor:pointer;background:transparent;color:var(--ink);font-family:inherit}
.filebox:hover{border-color:rgba(213,166,42,.7);background:rgba(213,166,42,.06)}
.filebox b{display:block;font-size:14.5px;margin-bottom:4px}
.filebox span{font-size:12.5px;color:var(--muted)}
.prog{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .3s}
.okrow{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:rgba(55,211,153,.09);border:1px solid rgba(55,211,153,.3)}
.okrow b{font-size:14px;display:block;word-break:break-word}
.okrow span{display:block;font-size:12px;color:#9ed9c0}
.review-sec{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;background:rgba(255,255,255,.028)}
.review-sec header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.review-sec h4{margin:0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#a49b83;font-weight:600;font-family:'Poppins',sans-serif}
.edit{background:none;border:0;color:var(--brand2);font-size:12px;font-weight:700;cursor:pointer;padding:4px 6px;border-radius:8px;font-family:'Poppins',sans-serif}
.edit:hover{background:rgba(213,166,42,.14)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted);font-size:12.5px}
.kv dd{margin:0;color:#eee9dd;word-break:break-word}
.sticky-submit{position:fixed;left:0;right:0;bottom:0;z-index:44;padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(18,19,24,.98),rgba(18,19,24,.72),transparent);display:none;justify-content:center}
.sticky-submit.on{display:flex}
.sticky-submit .btn{width:100%;max-width:540px;padding:16px}
.statushero{text-align:center;padding:34px 20px}
.statushero .tick{width:74px;height:74px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(140deg,rgba(55,211,153,.25),rgba(213,166,42,.12));border:1px solid rgba(55,211,153,.45);font-size:32px;animation:pop .5s}
.statushero h2{font-size:23px;margin:0 0 8px}
.statushero p{color:var(--muted);margin:0 auto 18px;max-width:46ch;font-size:14px}
.idchip{display:inline-block;font-family:'Poppins',monospace;font-size:15px;letter-spacing:.08em;padding:11px 18px;border-radius:12px;background:rgba(213,166,42,.12);border:1px dashed rgba(213,166,42,.5);color:#f3e8cd}
.sbadge{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;font-family:'Poppins',sans-serif}
.s-UnderReview{background:rgba(213,166,42,.14);color:#f0dca8;border:1px solid rgba(213,166,42,.4)}
.s-Shortlisted{background:rgba(242,200,138,.14);color:#f2d9a8;border:1px solid rgba(242,200,138,.4)}
.s-Interview{background:rgba(126,180,255,.14);color:#cfe2ff;border:1px solid rgba(126,180,255,.4)}
.s-Training{background:rgba(55,211,153,.14);color:#a9e8cd;border:1px solid rgba(55,211,153,.4)}
.s-Rejected{background:rgba(255,107,107,.13);color:#ffc2c2;border:1px solid rgba(255,107,107,.38)}
.s-Hired{background:rgba(55,211,153,.15);color:#a9e8cd;border:1px solid rgba(55,211,153,.4)}
.trackcard{max-width:540px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:95;padding:12px 20px;border-radius:12px;background:#262730;border:1px solid rgba(255,255,255,.16);font-size:13.5px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;color:#7d786d;font-size:11.5px;margin-top:26px;line-height:1.75}
.foot button{background:none;border:0;color:#b3954f;text-decoration:underline;cursor:pointer;font-size:11.5px;padding:0}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;display:inline-block}

function blackout(text, ms, preload){

  input.addEventListener('input', () => { onPick(input.value, false); draw(); });
  list.addEventListener('click', e => { const b = e.target.closest('.combo-item'); if (!b) return; input.value = b.dataset.v; list.hidden = true; onPick(b.dataset.v, true); });
  document.addEventListener('click', e => { if (!root.contains(e.target)) list.hidden = true; });
}
const cityNames = () => (boot ? boot.locations.map(l => l.city) : []);
const areaNames = city => { if (!boot) return []; const c = boot.locations.find(l => l.city === city); return c ? c.areas : []; };

/* ------------------------------ bootstrap -------------------------------- */
async function init(){
  $('brandImg').src = VECLAR_CONFIG.LOGO_URL;
  const resumed = loadDraft();
  const startedAt = Date.now();
  try { boot = await API.call('getBootstrap'); }
  catch (err) { boot = null; state.bootError = err.message; }
  const wait = Math.max(0, 2400 - (Date.now() - startedAt));
  await sleep(wait);
  $('loader').classList.add('off');
  $('hdr').hidden = false;
  if (!state.bootError && boot && boot.applicationsOpen === false) state.mode = 'closed';
  else state.mode = 'jd';
  state.hasDraft = !!resumed;
  render(true);
  replaceScreen();
}

/* ------------------------------- renderer -------------------------------- */
function render(animate){
  const main = $('main');
  $('stickySubmit').classList.remove('on');
  $('stickySubmit').innerHTML = '';
  $('recbar').classList.remove('on');
  const key = state.mode + ':' + state.step;
  const anim = animate === undefined ? key !== state._key : animate;
  state._key = key;
  main.classList.toggle('anim', !!anim);

  if (state.bootError) { renderHeader(); main.innerHTML = bootErrorHTML(); return; }
  if (state.mode === 'closed') { renderHeader(); main.innerHTML = closedHTML(); return; }
  if (state.mode === 'track') return renderTrack();
  if (state.mode === 'done') return renderDone();
  if (state.mode === 'jd') return renderJD();

  renderHeader();
  if (STEPS[state.step] === 'audio' && state.data.audioFileId && !rec.fileId) { rec.fileId = state.data.audioFileId; rec.duration = state.data.audioDuration || 0; }
  main.innerHTML = renderStep();
  bindStep();
  if (STEPS[state.step] === 'audio') { $('recbar').classList.add('on'); syncRecBar(); }
  if (STEPS[state.step] === 'review') {
    $('stickySubmit').classList.add('on');
    $('stickySubmit').innerHTML = '<button class="btn btn-p" id="submitBtn">Submit application</button>';
    $('submitBtn').onclick = submitApplication;
  }
}
function renderHeader(){
  const inSteps = state.mode === 'apply';
  $('stageBox').style.display = inSteps ? '' : 'none';
  if (inSteps) {
    $('pfill').style.width = (((state.step + 1) / STEPS.length) * 100) + '%';
    $('stageLabel').textContent = STAGES[Math.min(state.step, STAGES.length - 1)];
    $('stepCount').textContent = 'Step ' + (state.step + 1) + ' of ' + STEPS.length;
  } else {
    $('pfill').style.width = state.mode === 'done' ? '100%' : '0%';
  }
}
function bootErrorHTML(){
  return '<div class="card"><h1>Backend not configured</h1><p class="sub">This portal is not connected to its Google Apps Script deployment yet.</p><div class="banner">' + esc(state.bootError) + '</div><p class="hint">Open <b>index.html</b> and replace <code>PASTE_DEPLOYMENT_ID</code> in <code>VECLAR_CONFIG.API_URL</code> with your deployed Web App <code>/exec</code> URL.</p></div>';

function experienceText(){

function batchLabelOf(date){ const b = (boot.batches || []).find(x => x.date === date); return b ? b.label : date; }
function fmtTime(sec){ const s = Math.max(0, Math.round(sec)); return String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0'); }

/* -------------------------------- binding -------------------------------- */
function bindStep(){
  const d = state.data, s = STEPS[state.step];
  const back = $('backBtn'), next = $('nextBtn');
  if (back) back.onclick = () => { state.editing = null; state.step = Math.max(0, state.step - 1); saveDraft(); render(true); window.scrollTo({ top:0, behavior:'smooth' }); };
  if (next) next.onclick = () => advance(next);

  document.querySelectorAll('[data-group]').forEach(btn => btn.onclick = () => {
    d[btn.dataset.group === 'edu' ? 'education' : btn.dataset.group === 'gender' ? 'gender' : 'accentProficiency'] = btn.dataset.value;
    saveDraft(); render(false);
  });

  if (s === 'name') { const i = $('f_name'); i.oninput = () => { d.fullName = i.value; }; }
  if (s === 'location') {
    bindCombo('city', cityNames, (val, picked) => {
      if (picked) { d.city = val; d.area = ''; d._distKey = ''; d.distanceAvailable = false; d.distance = null; d.distanceReason = ''; d.mapUrl = ''; d.commuteConfirmed = false; saveDraft(); render(false); }
      else { d.city = val; }
    });
    bindCombo('area', () => areaNames(d.city), (val, picked) => { d.area = val; if (picked) calculateDistance(); });
  }
  if (s === 'organization') { const i = $('f_org'); i.oninput = () => { d.previousOrganization = i.value; }; }
  if (s === 'experience') {
    $('f_years').onchange = e => { d.experienceYears = e.target.value; saveDraft(); };
    $('f_months').onchange = e => { d.experienceMonths = e.target.value; saveDraft(); };
  }
  if (s === 'employment') {
    document.querySelectorAll('[data-emp]').forEach(b => b.onclick = () => {
      d.employmentStatus = b.dataset.emp;
      if (b.dataset.emp === 'No') d.trainingBatch = '';
      saveDraft(); render(false);
    });
    document.querySelectorAll('[data-batch]').forEach(b => b.onclick = () => { d.trainingBatch = b.dataset.batch; saveDraft(); render(false); });
  }
  if (s === 'campaigns') {
    bindCampaigns();
    $('campSearch').oninput = e => { d._campQuery = e.target.value; $('campList').innerHTML = campOptsHTML(); bindCampaigns(); };
    const o = $('f_other'); if (o) o.oninput = () => { d.campaignOther = o.value; };
  }
  if (s === 'age') { const i = $('f_age'); i.oninput = () => { d.age = i.value; }; }
  if (s === 'acknowledgments') {
    document.querySelectorAll('[data-ack]').forEach(b => b.onclick = () => {
      d.acknowledgments[b.dataset.ack] = !d.acknowledgments[b.dataset.ack];
      b.classList.toggle('sel', d.acknowledgments[b.dataset.ack]); saveDraft(); syncAckNext();
    });
    syncAckNext();
  }
  if (s === 'contact') {
    $('f_whatsapp').oninput = e => { d.whatsapp = e.target.value; };
    $('f_email').oninput = e => { d.email = e.target.value; };
  }
  if (s === 'resume') bindResume();
  if (s === 'audio') { syncRecBar(); }
  if (s === 'review') {
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
      state.editing = REVIEW_STEP;
      state.step = Number(b.dataset.edit);
      pushScreen();
      saveDraft(); render(true); window.scrollTo({ top:0, behavior:'smooth' });
    });
    const p = $('privacyBtn'); if (p) p.onclick = privacyModal;
  }
}
function syncAckNext(){
  const n = $('nextBtn'); if (!n) return;
  const a = state.data.acknowledgments;
  n.disabled = !(a.onsite && a.hours && a.truthful);
}
function bindCampaigns(){
  document.querySelectorAll('[data-camp]').forEach(b => b.onclick = () => {
    const d = state.data, v = b.dataset.camp, i = d.campaigns.indexOf(v);

}

/* ---------------------------- screen history ----------------------------- */
/* The device back button returns to the screen the visitor actually came from
 * — for example the step they just edited from the review page — instead of
 * simply stepping the wizard backwards. */
function screenState(){
  return { mode: state.mode, step: state.step, editing: state.editing };
}
function pushScreen(){
  try { history.pushState({ vtl: screenState() }, ''); } catch (e) { /* ignore */ }
}
function replaceScreen(){
  try { history.replaceState({ vtl: screenState() }, ''); } catch (e) { /* ignore */ }
}
function restoreScreen(s){
  state.mode = s.mode;
  state.step = Math.min(Number(s.step) || 0, REVIEW_STEP);
  state.editing = s.editing == null ? null : Number(s.editing);
  if (state.mode === 'track') state.track = { email: state.data.email || '', result: null };
  saveDraft();
  render(false);
  window.scrollTo({ top:0 });
}
window.addEventListener('popstate', e => {
  if (e.state && e.state.vtl) restoreScreen(e.state.vtl);
});

/* ------------------------------ navigation ------------------------------- */
function advanceTo(idx, animate){
  state.step = Math.min(idx, REVIEW_STEP);
  pushScreen();
  saveDraft();
  render(animate);
  window.scrollTo({ top:0, behavior:'smooth' });
}
async function advance(btn){
  hideErr();
  const s = STEPS[state.step], d = state.data;
  if (s === 'name') {
    d.fullName = ($('f_name').value || '').replace(/\s+/g, ' ').trim();
    if (d.fullName.length < 3) return showErr('Please enter your full name.');
    if (!/^[A-Za-z\u00C0-\u024F' .-]+$/.test(d.fullName)) return showErr('Please use letters only in your name.');
  }
  if (s === 'location') {
    if (!d.city) return showErr('Please select your city.');
    if (!d.area) return showErr('Please select your residential area.');
    /* the distance was already calculated when the area was chosen — never
     * recalculate it here, just confirm the commute */
    if (!distanceShown()) await calculateDistance();
    if (!d.commuteConfirmed) { commuteModal(); return; }
  }
  if (s === 'education' && !d.education) return showErr('Please select your highest level of education.');
  if (s === 'organization') {
    d.previousOrganization = (d.previousOrganization || '').trim();
    if (d.previousOrganization.length < 2) return showErr('Please enter the organization you last worked for.');
  }
  if (s === 'employment') {
    if (!d.employmentStatus) return showErr('Please tell us whether you are currently employed.');
    if (d.employmentStatus === 'Yes' && !d.trainingBatch) return showErr('Please choose your preferred training batch.');
  }
  if (s === 'campaigns') {
    if (!d.campaigns.length) return showErr('Please select at least one campaign type.');
    if (d.campaigns.includes('Other') && !(d.campaignOther || '').trim()) return showErr('Please describe the other campaign type.');
  }
  if (s === 'age') {
    const age = parseInt(d.age, 10);
    if (isNaN(age)) return showErr('Please enter your age.');
    if (age < 18) return showErr('You must be at least 18 years old to apply.');
    if (age > 70) return showErr('Please enter a valid age.');
  }
  if (s === 'gender' && !d.gender) return showErr('Please select an option.');
  if (s === 'accent') {
    if (!d.accentProficiency) return showErr('Please rate your American English accent.');
    if (d.accentProficiency === 'None' && !d._accentAcknowledged) { accentWarning(); return; }
  }
  if (s === 'audio' && !d.audioFileId) return showErr('Please record and save your spoken English assessment before continuing.');
  if (s === 'resume' && !d.resumeFileId) return showErr('Please upload your resume before continuing.');
  if (s === 'acknowledgments') {
    const a = d.acknowledgments;
    if (!a.onsite || !a.hours || !a.truthful) return showErr('Please accept all three acknowledgments.');
  }
  if (s === 'contact') {
    d.whatsapp = ($('f_whatsapp').value || '').trim();
    d.email = ($('f_email').value || '').trim();
    if (!/^(?:\+?92|0)?3\d{9}$/.test(d.whatsapp.replace(/[\s-]/g, ''))) return showErr('Enter a valid mobile number, e.g. 0300 1234567.');
    if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(d.email)) return showErr('Enter a valid email address.');
  }

  /* editing an earlier section from the review page returns straight to it */
  if (state.editing != null) {
    const target = state.editing;
    state.editing = null;
    state.step = target;
    pushScreen();
    saveDraft(); render(true);
    window.scrollTo({ top:0, behavior:'smooth' });
    return;
  }

  if (s === 'campaigns' && d.campaigns.includes('Realtor Lead Generation')) {
    await blackout('Perfect! We\u2019re on the same boat.', 3000, () => advanceTo(state.step + 1, false));
    return;
  }
  if (s === 'accent' && (d.accentProficiency === 'Good' || d.accentProficiency === 'Exceptional')) {
    await blackout('Let\u2019s find out if that\u2019s true.', 3000, () => advanceTo(state.step + 1, false));
    return;
  }
  advanceTo(state.step + 1, true);
}

/* ------------------------------- distance -------------------------------- */
let distanceTimer = null;
/* true once the distance for the current city + area has been calculated */
function distanceShown(){
  const d = state.data;
  return d._distKey === d.city + '|' + d.area && (d.distanceAvailable || !!d.distanceReason);
}
function calculateDistance(){
  const d = state.data;
  if (!d.city || !d.area) return Promise.resolve();
  const key = d.city + '|' + d.area;
  if (d._distKey === key && (d.distanceAvailable || d.distanceReason)) return Promise.resolve();
  d._distKey = key;
  d.distanceAvailable = false; d.distance = null; d.distanceReason = ''; d.commuteConfirmed = false;
  const box = $('distBox'); if (box) box.innerHTML = distHTML();
  return new Promise(resolve => {
    clearTimeout(distanceTimer);
    distanceTimer = setTimeout(async () => {
      try {
        const r = await API.call('distance', { city: d.city, area: d.area });
        d.distanceAvailable = !!r.available;
        d.distance = r.available ? r.km : null;
        d.distanceReason = r.available ? '' : (r.reason || 'We could not estimate a route for this area.');
        d.mapUrl = r.available ? (r.mapUrl || '') : '';
      } catch (err) {
        d.distanceReason = err.message;
      }
      saveDraft();
      const b2 = $('distBox'); if (b2) b2.innerHTML = distHTML();
      resolve();
    }, 150);
  });
}

/* ------------------------------- recording ------------------------------- */
function syncRecBar(){
  const mic = $('recMic'), save = $('recSave'), reset = $('recReset');
  if (!mic) return;
  mic.classList.toggle('rec', rec.state === 'recording' || rec.state === 'paused');
  $('recTime').textContent = fmtTime(rec.elapsed);
  $('recState').textContent = rec.state === 'recording' ? 'Recording — tap to stop' : rec.state === 'paused' ? 'Paused' : rec.state === 'ready' ? 'Ready to save' : rec.fileId ? 'Saved' : 'Tap to record';
  const active = rec.state === 'recording' || rec.state === 'paused';
  save.disabled = (!rec.blob && !active) || rec.busy;
  reset.disabled = !rec.blob && !rec.fileId && !active;
}
async function micTap(){
  if (rec.busy) return;
  if (rec.state === 'idle') return startRec();
  if (rec.state === 'recording') return pauseRec();
  if (rec.state === 'paused') return resumeRec();
  if (rec.state === 'ready') return toast('Press Save to upload this take, or Reset to record again.');
  if (rec.state === 'saved') return toast('This take is uploaded. Press Reset to record a new one.');
}
async function startRec(){
  try {
    rec.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:true, noiseSuppression:true } });
  } catch (err) {
    showErr('Microphone access was blocked. Please allow microphone permission in your browser and try again.');
    return;
  }
  const mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
  rec.chunks = []; rec.elapsed = 0; rec.blob = null; rec.url = null; rec.fileId = null; rec.duration = 0;
  rec.mr = new MediaRecorder(rec.stream, mime ? { mimeType: mime } : undefined);
  rec.mr.ondataavailable = e => { if (e.data && e.data.size) rec.chunks.push(e.data); };
  rec.mr.onstop = () => {
    const type = rec.mr.mimeType || 'audio/webm';
    rec.blob = new Blob(rec.chunks, { type });
    rec.url = URL.createObjectURL(rec.blob);
    rec.sizeKB = Math.round(rec.blob.size / 1024);
    rec.state = 'ready';
    if (rec.stream) rec.stream.getTracks().forEach(t => t.stop());
    stopSilenceWatch();
    const box = $('audioStatus'); if (box) box.innerHTML = audioStatusHTML();
    syncRecBar();
  };
  rec.mr.start(1000);
  rec.state = 'recording';
  rec.tick = setInterval(() => { rec.elapsed += 1; const t = $('recTime'); if (t) t.textContent = fmtTime(rec.elapsed); }, 1000);
  startSilenceWatch();
  syncRecBar();
}
/* shows a pill when the applicant has been silent for 5 seconds */
function startSilenceWatch(){
  stopSilenceWatch();
  rec.silentMs = 0; rec.warned = false;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    rec.ac = new Ctx();
    const src = rec.ac.createMediaStreamSource(rec.stream);
    const analyser = rec.ac.createAnalyser();
    analyser.fftSize = 1024;
    src.connect(analyser);
    const buf = new Uint8Array(analyser.fftSize);
    rec.silenceTick = setInterval(() => {
      if (rec.state !== 'recording') { hideSilence(); return; }
      analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / buf.length);
      if (rms < 0.012) { rec.silentMs += 250; } else { rec.silentMs = 0; hideSilence(); }
      if (rec.silentMs >= 5000) showSilence();
    }, 250);
  } catch (err) { /* silence detection is optional */ }
}
function stopSilenceWatch(){
  clearInterval(rec.silenceTick); rec.silenceTick = null;
  if (rec.ac) { try { rec.ac.close(); } catch(e){} rec.ac = null; }
  hideSilence();
}
function showSilence(){ rec.warned = true; $('silencePill').classList.add('on'); }
function hideSilence(){ if (rec.warned) { rec.warned = false; $('silencePill').classList.remove('on'); } }
function pauseRec(){ rec.mr.pause(); rec.state = 'paused'; clearInterval(rec.tick); hideSilence(); syncRecBar(); }
function resumeRec(){ rec.mr.resume(); rec.state = 'recording'; rec.tick = setInterval(() => { rec.elapsed += 1; const t = $('recTime'); if (t) t.textContent = fmtTime(rec.elapsed); }, 1000); syncRecBar(); }
function stopRec(){ if (rec.mr && rec.mr.state !== 'inactive') rec.mr.stop(); clearInterval(rec.tick); }
async function recReset(silent){
  if (!silent && !confirm('Delete this recording and start again?')) return;
  if (rec.state === 'recording' || rec.state === 'paused') { try { rec.mr.stop(); } catch(e){} clearInterval(rec.tick); }
  if (rec.fileId) { try { await API.call('deleteUpload', { submissionToken: TOKEN, fileId: rec.fileId }); } catch (err) { toast('Could not delete the uploaded recording: ' + err.message); return; } }
  rec.fileId = null; state.data.audioFileId = ''; state.data.audioDuration = 0;
  rec.blob = null; rec.url = null; rec.chunks = []; rec.elapsed = 0; rec.state = 'idle'; rec.duration = 0;
  saveDraft();
  const box = $('audioStatus'); if (box) box.innerHTML = audioStatusHTML();
  syncRecBar();
}
async function saveRec(){
  if (rec.busy) return;
  if ((rec.state === 'recording' || rec.state === 'paused') && rec.mr) {
    await new Promise(resolve => { const prev = rec.mr.onstop; rec.mr.onstop = () => { if (prev) prev(); resolve(); }; stopRec(); });
  }
  if (!rec.blob) return;
  const maxBytes = boot.limits.maxAudioMB * 1024 * 1024;
  if (rec.blob.size > maxBytes) { showErr('This recording is larger than ' + boot.limits.maxAudioMB + ' MB. Please record a shorter take.'); return; }
  if (rec.elapsed < boot.limits.minAudioSeconds) { showErr('Please record at least ' + boot.limits.minAudioSeconds + ' seconds.'); return; }
  rec.busy = true; syncRecBar();
  progressOverlay(true, 0, 'Uploading your recording…');
  try {
    const init = await API.call('uploadAudioInit', { submissionToken: TOKEN, mimeType: rec.blob.type || 'audio/webm', totalBytes: rec.blob.size });
    const chunk = init.chunkBytes, total = Math.ceil(rec.blob.size / chunk);
    for (let i = 0; i < total; i++) {
      const part = rec.blob.slice(i * chunk, (i + 1) * chunk);
      const b64 = await blobToBase64(part);
      await API.call('uploadAudioChunk', { submissionToken: TOKEN, uploadId: init.uploadId, index: i, data: b64 });
      progressOverlay(true, Math.round(((i + 1) / total) * 92), 'Uploading your recording…');
    }
    progressOverlay(true, 97, 'Finishing up…');
    const fin = await API.call('uploadAudioFinalize', { submissionToken: TOKEN, uploadId: init.uploadId, duration: rec.elapsed });
    rec.fileId = fin.fileId; rec.duration = fin.durationSeconds || rec.elapsed;
    rec.blob = null; rec.state = 'saved';
    state.data.audioFileId = fin.fileId; state.data.audioDuration = rec.duration; state.data.audioSizeKB = fin.sizeKB;
    saveDraft();
    progressOverlay(true, 100, 'Recording saved');
    await sleep(520);
    progressOverlay(false);
    const box = $('audioStatus'); if (box) box.innerHTML = audioStatusHTML();
    toast('Recording uploaded');
  } catch (err) {
    progressOverlay(false);
    const box = $('audioStatus');
    if (box) box.innerHTML = audioStatusHTML() + '<div class="banner" style="margin-top:12px">Upload failed: ' + esc(err.message) + ' Your recording is still here — press Save to retry.</div>';
  } finally {
    rec.busy = false; syncRecBar();
  }
}
function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = () => reject(new Error('Could not read the file.'));
    r.readAsDataURL(blob);
  });
}

/* -------------------------------- resume --------------------------------- */
function bindResume(){
  const drop = $('resumeDrop'), input = $('resumeInput'), replace = $('replaceResume');
  if (replace) replace.onclick = () => { state.data.resumeFileId = ''; state.data.resumeName = ''; state.data.resumeSizeKB = 0; saveDraft(); $('resumeBox').innerHTML = resumeHTML(); bindResume(); };
  if (drop && input) { drop.onclick = () => input.click(); input.onchange = () => handleResume(input.files[0]); }
}
async function handleResume(file){
  if (!file) return;
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') { showErr('Please upload a PDF file.'); return; }
  if (file.size > boot.limits.maxResumeMB * 1024 * 1024) { showErr('Your resume must be under ' + boot.limits.maxResumeMB + ' MB.'); return; }
  progressOverlay(true, 8, 'Uploading your resume…');
  try {
    const b64 = await blobToBase64(file);
    progressOverlay(true, 55, 'Uploading your resume…');
    const r = await API.call('uploadResume', { submissionToken: TOKEN, filename: file.name, mimeType: 'application/pdf', data: b64 });
    Object.assign(state.data, { resumeFileId: r.fileId, resumeName: r.name, resumeSizeKB: r.sizeKB });
    saveDraft();
    progressOverlay(true, 100, 'Resume uploaded');
    await sleep(500);
    progressOverlay(false);
    $('resumeBox').innerHTML = resumeHTML(); bindResume();
    toast('Resume uploaded');
  } catch (err) {
    progressOverlay(false);
    showErr('Resume upload failed: ' + err.message);
  }
}

async function submitApplication(){
  hideErr();
  const btn = $('submitBtn');
  const d = state.data;
  const payload = {
    fullName: d.fullName, city: d.city, area: d.area, education: d.education,
    previousOrganization: d.previousOrganization, experienceYears: d.experienceYears, experienceMonths: d.experienceMonths,
    employmentStatus: d.employmentStatus, trainingBatch: d.trainingBatch, campaigns: d.campaigns, campaignOther: d.campaignOther,

  };
  if (btn) { btn.disabled = true; btn.innerHTML = 'Submitting…'; }
  progressOverlay(true, 6, 'Submitting your application…');

  try {

    clearInterval(tick);

/* --------------------------------- boot ---------------------------------- */
$('recMic').onclick = micTap;
$('recSave').onclick = saveRec;
$('recReset').onclick = () => recReset(false);
$('ov').addEventListener('click', e => { if (e.target === $('ov')) closeModal(); });
$('trackBtn').onclick = () => { state.mode = 'track'; state.track = { email: state.data.email || '', result: null }; pushScreen(); render(true); window.scrollTo({ top:0 }); };
$('brandHome').onclick = () => { if (state.mode !== 'jd') { state.mode = 'jd'; pushScreen(); render(true); window.scrollTo({ top:0 }); } };
window.addEventListener('beforeunload', e => { if (rec.state === 'recording') { e.preventDefault(); e.returnValue = ''; } });
init();
</script>
</body>
</html>
